name: Build Telegram iOS IPA

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Создать GitHub Release с прикрепленным .ipa?'
        required: true
        type: boolean
        default: true
  # Раскомментируйте, если хотите запускать сборку автоматически при каждом пуше в main:
  # push:
  #   branches: [ main ]

jobs:
  build:
    name: Build .IPA (macOS Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Xcode version
        run: |
          set -e
          echo "=== Определение и настройка версии Xcode ==="
          ls -ld /Applications/Xcode* || true
          
          REQ_XCODE=""
          if [ -f "Telegram-iOS/versions.json" ]; then
            REQ_XCODE=$(python3 -c 'import json; print(json.load(open("Telegram-iOS/versions.json")).get("xcode", ""))' 2>/dev/null || echo "")
          fi
          
          echo "Требуемая версия из versions.json: $REQ_XCODE"
          
          if [ -n "$REQ_XCODE" ] && [ -d "/Applications/Xcode_${REQ_XCODE}.app" ]; then
            echo "Выбираем /Applications/Xcode_${REQ_XCODE}.app"
            sudo xcode-select -s "/Applications/Xcode_${REQ_XCODE}.app/Contents/Developer"
          elif ls -d /Applications/Xcode_26*.app 1> /dev/null 2>&1; then
            BEST_XCODE=$(ls -d /Applications/Xcode_26*.app | tail -n 1)
            echo "Выбираем доступную версию Xcode 26: $BEST_XCODE"
            sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            echo "Выбираем /Applications/Xcode_16.2.app"
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            echo "Выбираем /Applications/Xcode_16.0.app"
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          
          DEV_DIR="$(xcode-select -p)"
          echo "Активный путь Xcode: $DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> $GITHUB_ENV
          xcodebuild -version

      - name: Prepare canonical source directory
        run: |
          set -e
          set -x
          
          # Убеждаемся, что все сабмодули выкачаны
          git submodule update --init --recursive --jobs 8
          
          SOURCE_DIR="/Users/Shared/telegram-ios"
          sudo mkdir -p /Users/Shared
          sudo rm -rf "$SOURCE_DIR"
          
          # Копируем Telegram-iOS со всеми сабмодулями в каноническую директорию
          cp -R "$GITHUB_WORKSPACE/Telegram-iOS" "$SOURCE_DIR"
          
          # Проверяем ключевые сабмодули Bazel
          if [ ! -f "$SOURCE_DIR/build-system/bazel-rules/rules_xcodeproj/MODULE.bazel" ]; then
            echo "ОШИБКА: rules_xcodeproj/MODULE.bazel не найден!"
            exit 1
          fi
          
          echo "Сабмодули успешно подготовлены в $SOURCE_DIR"

      - name: Build Telegram iOS (.ipa)
        run: |
          set -e
          set -x
          
          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          
          cd "$SOURCE_DIR"
          
          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 3730)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])' 2>/dev/null || echo "1.0.0")"
          COMMIT_COUNT="$(git -C "$GITHUB_WORKSPACE" rev-list --count HEAD 2>/dev/null || echo 100)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          
          echo "Сборка приложения: версия $APP_VERSION, номер сборки $BUILD_NUMBER"
          
          # Импорт фейковых сертификатов кодоподписи
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          
          # Компиляция через Bazel
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="build/artifacts"
          
          OUTPUT_PATH="build/artifacts"
          
          # Проверяем артефакты от Make.py
          if [ -f "$OUTPUT_PATH/Swiftgram.ipa" ]; then
            cp "$OUTPUT_PATH/Swiftgram.ipa" "$OUTPUT_PATH/Telegram.ipa"
            echo "Swiftgram.ipa успешно сформирован Make.py:"
            ls -lh "$OUTPUT_PATH/Swiftgram.ipa"
          fi
          
          if [ -f "$OUTPUT_PATH/Swiftgram.DSYMs.zip" ]; then
            cp "$OUTPUT_PATH/Swiftgram.DSYMs.zip" "$OUTPUT_PATH/Telegram.DSYMs.zip"
          fi

          # Запасной поиск в bazel-bin и bazel-out, если Make.py не переместил
          if [ ! -f "$OUTPUT_PATH/Telegram.ipa" ]; then
            echo "Поиск .ipa в bazel-bin и bazel-out..."
            FOUND_IPA=$(find bazel-bin bazel-out -name "*.ipa" 2>/dev/null | head -n 1)
            if [ -n "$FOUND_IPA" ]; then
              mkdir -p "$OUTPUT_PATH"
              cp "$FOUND_IPA" "$OUTPUT_PATH/Telegram.ipa"
              cp "$FOUND_IPA" "$OUTPUT_PATH/Swiftgram.ipa"
              echo "IPA найден ($FOUND_IPA) и скопирован в $OUTPUT_PATH"
              ls -lh "$OUTPUT_PATH/Telegram.ipa"
            else
              echo "ОШИБКА: Файл .ipa не найден в bazel-bin или bazel-out!"
              find bazel-bin -name "*.app" -o -name "*.ipa" 2>/dev/null | head -n 30
              exit 1
            fi
          fi
          
          # Сбор dSYM, если архив еще не создан
          if [ ! -f "$OUTPUT_PATH/Telegram.DSYMs.zip" ]; then
            mkdir -p build/DSYMs
            find bazel-bin bazel-out -name "*.dSYM" -exec cp -R {} build/DSYMs/ \; 2>/dev/null || true
            if [ -d "build/DSYMs" ] && [ "$(ls -A build/DSYMs)" ]; then
              zip -r "$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null || true
            fi
          fi

          echo "=== Создание версии для Sideloading (SideStore / LiveContainer / AltStore) ==="
          # Удаляем расширения (PlugIns) и Watch, чтобы:
          # 1. Устранить ошибку SideStore "Mismatched bundle IDs" (IXErrorDomain Code=8)
          # 2. Не исчерпывать лимит 10 App ID бесплатного Apple ID (без расширений нужен всего 1 App ID вместо 7)
          # 3. Обеспечить корректный запуск в LiveContainer
          
          TEMP_SIDELOAD_DIR="$(mktemp -d)"
          unzip -q "$OUTPUT_PATH/Swiftgram.ipa" -d "$TEMP_SIDELOAD_DIR"
          
          # Удаляем папки PlugIns и Watch внутри Payload/*.app
          rm -rf "$TEMP_SIDELOAD_DIR"/Payload/*.app/PlugIns
          rm -rf "$TEMP_SIDELOAD_DIR"/Payload/*.app/Watch
          
          # Запаковываем обратно с сохранением симлинков (-y)
          (cd "$TEMP_SIDELOAD_DIR" && zip -qr -y "$OUTPUT_PATH/Swiftgram-Sideload.ipa" *)
          cp "$OUTPUT_PATH/Swiftgram-Sideload.ipa" "$OUTPUT_PATH/Telegram-Sideload.ipa"
          rm -rf "$TEMP_SIDELOAD_DIR"
          
          echo "Sideload IPA успешно созданы:"
          ls -lh "$OUTPUT_PATH"/*Sideload*.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          name: Swiftgram v${{ env.APP_VERSION }} (Сборка ${{ env.BUILD_NUMBER }})
          body: |
            Автоматическая сборка приложения Telegram iOS (Swiftgram).
            - Версия: ${{ env.APP_VERSION }}
            - Билд: ${{ env.BUILD_NUMBER }}
            - Собрано через GitHub Actions (macOS).

            ### 📲 Рекомендации по установке:
            - **Swiftgram-Sideload.ipa** (или `Telegram-Sideload.ipa`) — **РЕКОМЕНДУЕТСЯ** для SideStore, LiveContainer, AltStore, TrollStore, Scarlet и бесплатных аккаунтов Apple ID (удалены App Extensions, исправлена ошибка `Mismatched bundle IDs`, не расходуются лимиты 10 App ID, добавлен фоллбек при отсутствии App Groups).
            - **Swiftgram.ipa** (или `Telegram.ipa`) — полная сборка со всеми расширениями (для платных аккаунтов Apple Developer с активными App Groups).
          files: |
            /Users/Shared/telegram-ios/build/artifacts/*.ipa
            /Users/Shared/telegram-ios/build/artifacts/*.zip
          draft: false
          prerelease: false
